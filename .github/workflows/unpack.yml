{"name":"Unpack site","on":{"push":{"paths":["*.zip",".github/workflows/unpack.yml"]}},"permissions":{"contents":"write"},"jobs":{"unpack":{"runs-on":"ubuntu-latest","steps":[{"uses":"actions/checkout@v4"},{"run":"if ls ./*.zip >/dev/null 2>&1; then mkdir _x && unzip -q -o ./*.zip -d _x && d=$(dirname \"$(find _x -name server.py | head -1)\") && rm -rf \"$d/__pycache__\" && cp -a \"$d/.\" . && rm -rf _x ./*.zip && git config user.name github-actions && git config user.email actions@github.com && git add -A && git commit -m 'Unpack site' && git push; fi"}]}}}
