<!doctype html>
<html lang="en" data-theme="dark"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#002626"><title>AgroSupport (AAIAP) — Agronomic platform</title>
<link rel="icon" type="image/png" href="./assets/favicon.png">
<script>try{var s=localStorage.getItem('aaiap-theme');var v=(s==='light'||s==='dark')?s:(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark');document.documentElement.dataset.theme=v}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=PT+Sans:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://unpkg.com"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="./map.css"><link rel="stylesheet" href="./styles.css">
</head><body>
<div id="bgPhoto" class="bg-photo" aria-hidden="true"></div>
<div id="app">
 <div id="map" data-i18n-attr="aria-label:map.aria"></div>
 <header class="topbar">
  <div class="brand"><span class="logo-mark"><img src="./assets/logo.png" alt="" width="44" height="44"></span><div><strong>AgroSupport</strong><small>AAIAP · GIS</small></div></div>
  <div class="header-actions">
   <button id="backToPortal" type="button" class="pill-btn solid"><span data-icon="arrowLeft"></span><span data-i18n="map.back"></span></button>
   <button id="roleToggle" hidden></button>
   <span class="live-dot" aria-hidden="true"></span><span class="desktop-only">RESEARCH GIS · 0.1.3</span>
   <div class="lang-switch" role="group" data-i18n-attr="aria-label:lang.aria"><button type="button" data-lang-btn="en">EN</button><button type="button" data-lang-btn="ru">RU</button><button type="button" data-lang-btn="tg">TJ</button></div>
   <button type="button" class="round-btn js-theme" data-i18n-attr="title:theme.toggle;aria-label:theme.toggle"><span class="theme-icon"></span></button>
  </div>
 </header>
 <div class="map-hint" id="mapHint" data-i18n="map.hint0"></div>
 <div class="map-actions">
  <button id="worldBtn" type="button"><span data-icon="globe"></span><span data-i18n="map.world"></span></button>
  <button id="nebraskaBtn" type="button"><span data-icon="pin"></span><span>Nebraska</span></button>
  <button id="tajikBtn" type="button"><span data-icon="pin"></span><span data-i18n="map.tj"></span></button>
  <button id="gibsBtn" type="button" aria-pressed="false" title="NASA GIBS true-color layer">🛰 NASA GIBS</button><button id="layersBtn" type="button"><span data-icon="layers"></span><span data-i18n="map.layers"></span></button>
  <button id="contoursBtn" type="button" aria-pressed="true"><span data-icon="contour"></span><span id="contoursLabel" data-i18n="map.cOn"></span></button>
  <label class="upload-btn" data-i18n-attr="title:map.importTitle"><span data-icon="upload"></span><span data-i18n="map.import"></span><input id="geojsonInput" type="file" accept=".geojson,.json,application/geo+json,application/json" hidden></label>
 </div>
 <div class="map-legend"><div class="legend-heading">AgroSupport / GIS</div>
  <div class="lg-row"><span class="legend-swatch" style="background:var(--lime)"></span><span data-i18n="lg.research"></span></div>
  <div class="lg-row"><span class="legend-swatch" style="background:var(--clay)"></span><span data-i18n="lg.demo"></span></div>
  <div class="lg-row"><span class="legend-swatch" style="background:var(--teal)"></span><span data-i18n="lg.contour"></span></div>
  <div class="legend-note" id="contourStatus" data-i18n="lg.note"></div><div class="legend-note" id="boundaryStatus" data-i18n="lg.loading"></div></div>
 <aside class="panel panel-left" id="leftPanel" aria-hidden="true"><div class="panel-header"><div><span class="eyebrow" data-i18n="pn.eyebrow"></span><h2 id="fieldTitle" data-i18n="pn.site"></h2><p id="fieldSubtitle"></p></div><button class="close-panel" data-close="true" data-i18n-attr="aria-label:pn.close"><span data-icon="close"></span></button></div><div class="panel-content"><div class="demo-alert" data-i18n="pn.alert"></div><div id="fieldContent"></div></div></aside>
 <aside class="panel panel-right" id="rightPanel" aria-hidden="true"><div class="panel-header"><div><span class="eyebrow" data-i18n="pn.photoEye"></span><h2 data-i18n="pn.photoH"></h2><p data-i18n="pn.photoP"></p></div><button class="close-panel" data-close="true" data-i18n-attr="aria-label:pn.close"><span data-icon="close"></span></button></div><div class="panel-content" id="photoPreviewContent"></div></aside>
 <div class="role-gate" id="roleGate" hidden></div><main id="fieldPage" class="field-page" hidden></main>
 <div class="bottom-credit" data-i18n="cred"></div>
</div>
<div id="portal" class="portal" aria-live="polite">
 <header class="sitebar">
  <button class="identity" id="homeBrand" type="button" data-i18n-attr="aria-label:home.aria"><span class="logo-mark"><img src="./assets/logo.png" alt="" width="48" height="48"></span><span class="idtext"><strong>AgroSupport</strong><small data-i18n="brand.sub"></small></span></button>
  <nav class="site-nav" data-i18n-attr="aria-label:nav.aria"><button data-nav="welcome" type="button" data-i18n="nav.start"></button><button data-nav="catalog" type="button" data-i18n="nav.crops"></button><button data-nav="methodology" type="button" aria-label="Methodology and AI transparency">Science & AI</button><button data-nav="map" type="button"><span data-i18n="nav.map"></span><span data-icon="arrowUpRight" data-size="15"></span></button></nav>
  <div class="site-tools">
   <div class="lang-switch" role="group" data-i18n-attr="aria-label:lang.aria"><button type="button" data-lang-btn="en">EN</button><button type="button" data-lang-btn="ru">RU</button><button type="button" data-lang-btn="tg">TJ</button></div>
   <button type="button" class="round-btn js-theme" data-i18n-attr="title:theme.toggle;aria-label:theme.toggle"><span class="theme-icon"></span></button>
  </div>
 </header>
 <div id="portalContent"></div>
 <footer class="site-footer"><span data-i18n="footer.l"></span><span data-i18n="footer.r"></span></footer>
</div>
<div id="photoEditorBackdrop" class="photo-editor-backdrop" hidden>
  <section class="photo-editor-modal" role="dialog" aria-modal="true" aria-labelledby="photoEditorTitle">
    <header class="photo-editor-header"><div><span class="photo-editor-overline">AAIAP · ADMIN</span><h2 id="photoEditorTitle">Редактор фотографий</h2></div><button id="photoEditorClose" type="button" aria-label="Закрыть редактор">×</button></header>
    <div id="photoEditorNotice" class="photo-editor-notice" role="status" hidden></div>
    <div id="photoEditorBody" class="photo-editor-body"></div>
  </section>
</div>
<div id="toast" role="status" aria-live="polite" class="toast" hidden></div>
<script>try{localStorage.setItem('aaiap-role','farmer')}catch(e){}</script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" onerror="var s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js';document.head.appendChild(s)"></script>
<script type="module" src="./js/main.js"></script>
<script type="module" src="./js/portal.js"></script>
</body></html>
